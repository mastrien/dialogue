name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - working-directory: desktop
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*-setup.exe

  build-mobile-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Build Rust core for Android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o mobile/android/app/src/main/jniLibs build --release -p dialogue_core
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release
      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF_NAME:-dev}
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "Dialogue-${VERSION}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: Dialogue-*-android.apk

  publish-release:
    needs: [build-desktop-windows, build-mobile-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
